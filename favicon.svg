<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="County Index">
  <rect width="32" height="32" rx="7" fill="#0c0d10"/>
  <!-- four large county tiles: choropleth mark that survives 16px -->
  <g stroke="#0c0d10" stroke-width="1.6" stroke-linejoin="round">
    <polygon fill="#b7c3ce" points="5,7.5 16,6.5 16,16 6,17"/>
    <polygon fill="#355f8c" points="16,6.5 27,7.5 26,16 16,16"/>
    <polygon fill="#9e3a34" points="6,17 16,16 16,26.5 7,25.5"/>
    <polygon fill="#ece9e2" points="16,16 26,16 25,25.5 16,26.5"/>
  </g>
</svg>
